#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Andrew Hampton"
email = "andrewwh@gmail.com"

[ui]
# default-command = ["log", "-r", "(heads(::trunk() & ::@):: & ::trunk()) | (heads(::trunk() & ::@):: & ::@) | @::"]
default-command = [
  "log",
  "-r",
  "fork_point(@ | main)::(@ | main)",
  "-T",
  "status_log",
]
# pager = ":builtin"
conflict-marker-style = "snapshot"

pager = ["delta", "--line-numbers"]
diff-formatter = ":git"

[colors]
"diff removed token" = { underline = false }
"diff added token" = { underline = false }
"pr" = { fg = "bright cyan", bold = true }
"main" = { fg = "bright yellow", bold = true, underline = true }
"empty-label" = { fg = "bright black", bold = true }
"quiet" = { fg = "bright black" }
"quiet author" = { fg = "bright black" }
"quiet timestamp" = { fg = "bright black" }

[ui.streampager]
interface = "quit-if-one-page"  # same behavior as less -FRX

[templates]
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.summary()),
  ),
  "\n",
  "JJ: ignore-rest\n",
  diff.git(),
)
'''

[template-aliases]
# "format_timestamp(timestamp)" = "format_timestamp(timestamp, \"%Y-%m-%d %H:%M:%S %z\")"
"status_bookmarks(commit)" = '''
commit.bookmarks().map(|bookmark|
  if(
    bookmark.name() == "main" && (!bookmark.remote() || bookmark.remote() == "origin"),
    label("main", concat(bookmark)),
    bookmark,
  )
)
'''
status_log = '''
label(
  separate(
    " ",
    if(current_working_copy, "working_copy"),
    if(immutable, "immutable", "mutable"),
  ),
  if(
    root,
    format_root_commit(self),
    if(
      parents.len() > 1,
      separate(
        " ",
        label(
          "pr",
          if(
            description.first_line().match(regex:"#[0-9]+"),
            "PR " ++ description.first_line().match(regex:"#[0-9]+"),
            "merge",
          ),
        ),
        status_bookmarks(self),
        working_copies,
      ),
      if(
        empty && !description,
        separate(
          " ",
          label("empty-label", "empty"),
          status_bookmarks(self),
          working_copies,
        ),
        separate(
          " ",
          format_short_change_id(change_id),
          status_bookmarks(self),
          working_copies,
          label("description", coalesce(description.first_line(), description_placeholder)),
          label(
            "quiet",
            author.email() ++ " · " ++ commit_timestamp(self).local().format("%Y-%m-%d"),
          ),
        ),
      ),
    ),
  ),
) ++ "\n"
'''

[signing]
behavior = "force"
backend  = "ssh"
key      = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBoKM9nM2uJb/qELkBVg8btd5/v/dn5tLFlLIjKKV8Nt"
backends.ssh.program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"

[aliases]
# Delete bookmarks (local and on origin) that have been merged into trunk.
# Skips main/master/trunk. Note: squash-merged bookmarks are not ancestors of
# trunk, so they are not caught here (rely on `jj git fetch` + GitHub's
# "Automatically delete head branches" for those).
tidy = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj git fetch
merged=$(jj bookmark list -r '::trunk()' -T 'if(!self.remote(), self.name() ++ "\n")' | grep -vxE 'main|master|trunk' || true)
if [ -z "$merged" ]; then
  echo "No merged bookmarks to delete."
else
  jj bookmark delete $merged
  jj git push --deleted
fi
''', ""]

[revsets]
# Try to keep the change ID short for my recent commits and the current branch commits
# short-prefixes = '(mine() & committer_date(after:"1 day ago")) | (main::@) | @::'
short-prefixes = 'heads(::main & ::@)::'

[remotes.origin]
auto-track-bookmarks = "glob:*"

[snapshot]
auto-update-stale = true

[git]
write-change-id-header = true
